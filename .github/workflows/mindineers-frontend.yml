name: Mindineers frontend
on:
  push:
    branches: [main]
    paths: ['apps/mindineers-web/**', 'vercel.json', '.github/workflows/mindineers-frontend.yml']
  pull_request:
    paths: ['apps/mindineers-web/**', 'vercel.json', '.github/workflows/mindineers-frontend.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/mindineers-web/package-lock.json
      - run: npm ci --prefix apps/mindineers-web --workspaces=false --ignore-scripts
      - run: npm run verify:release --prefix apps/mindineers-web
